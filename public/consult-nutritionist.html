<body style="display:flex;flex-direction:column;min-height:100vh">



<main style="padding-top:92px;flex:1">
  <div class="nutritionists-grid" id="nutritionists">
    <div class="nutritionist-card" data-specs="Weight Loss Muscle Gain General Wellness">
      <div class="nutritionist-photo">👨</div>
      <div class="nutritionist-info">
        <div class="nutritionist-name" style="display:flex;align-items:center;gap:8px;">Deepjyoti Ray
          <a href="https://www.linkedin.com/in/djray" target="_blank" aria-label="LinkedIn Profile" style="color:#0077b5;font-size:1.2rem;"><i class="fa-brands fa-linkedin"></i></a>
        </div>
        <div class="nutritionist-specs">Weight Loss &bull; Muscle Gain &bull; General Wellness</div>
        <div class="nutritionist-exp">Expert Nutritionist</div>
        <div class="nutritionist-price">&#8377;799 / session</div>
        <button class="book-btn" onclick="openBooking('Deepjyoti Ray')">Book Appointment</button>
      </div>
    </div>
  </div>
</main>

<!-- Booking Modal -->
<div class="booking-modal" id="booking-modal">
  <div class="booking-modal-content">
    <div class="booking-modal-header">
      <h3 id="booking-modal-title">Book Appointment</h3>
      <button class="drawer-close" onclick="closeBooking()" aria-label="Close">&#x2715;</button>
    </div>
    <div class="booking-modal-body" id="booking-form-body">
      <div class="booking-field"><label for="b-name">Your Name *</label><input type="text" id="b-name" placeholder="Full name" autocomplete="name"></div>
      <div class="booking-field"><label for="b-phone">Phone Number *</label><input type="tel" id="b-phone" placeholder="10-digit mobile number" inputmode="numeric" maxlength="10"></div>
      <div class="booking-field"><label for="b-email">Email</label><input type="email" id="b-email" placeholder="your@email.com" autocomplete="email"></div>
      <div class="booking-field"><label for="b-goal">Health Goal *</label>
        <select id="b-goal">
          <option value="">Select your goal</option>
          <option>Weight Loss</option><option>Muscle Gain</option><option>PCOS</option><option>Diabetes</option><option>General Wellness</option>
        </select>
      </div>
      <div class="booking-field"><label for="b-time">Preferred Consultation Time *</label><input type="datetime-local" id="b-time"></div>
      <button class="booking-submit-btn" onclick="submitBooking()">Confirm Booking</button>
    </div>
    <div class="booking-confirmation" id="booking-confirmation">
      <div class="confirm-icon">&#9989;</div>
      <h3>Booking Confirmed!</h3>
      <p id="booking-confirm-msg">We'll reach out to confirm your appointment details via WhatsApp or phone.</p>
      <button class="book-btn" style="margin-top:16px;width:auto;padding:12px 28px" onclick="closeBooking()">Done</button>
    </div>
  </div>
</div>

<nav id="mobile-bottom-nav">
  <button class="mob-nav-btn" onclick="window.location.href='/'"><i class="fa-solid fa-house"></i>Home</button>
  <button class="mob-nav-btn" onclick="window.location.href='/?tab=menu'"><i class="fa-solid fa-utensils"></i>Menu</button>
  <button class="mob-nav-btn" onclick="window.location.href='/nutrition'"><i class="fa-solid fa-leaf"></i>Nutrition</button>
  <button class="mob-nav-btn active"><i class="fa-solid fa-stethoscope"></i>Consult</button>
  <button class="mob-nav-btn" onclick="window.location.href='/profile'"><i class="fa-solid fa-heart-pulse"></i>My Health</button>
</nav>

<footer class="page-footer">
  &copy; 2026 Healthy Meal Spot &bull; <a href="/">Order Food</a> &bull; <a href="/nutrition">Nutrition Hub</a>
</footer>

<script>
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBooking(); });

let selectedNutritionist = '';
let _activeFilter = 'all';
let _searchQ = '';

function filterBySpec(filter, btn) {
  _activeFilter = filter;
  document.querySelectorAll('#menu-header-bar .top-sellers-tab').forEach(b => {
    const on = b.dataset.filter === filter;
    b.style.background = on ? 'var(--accent)' : '';
    b.style.color = on ? '#fff' : '';
    b.style.borderColor = on ? 'var(--accent)' : '';
  });
  applyFilters();
}

function applyFilters() {
  document.querySelectorAll('.nutritionist-card').forEach(card => {
    const specs = (card.dataset.specs || '').toLowerCase();
    const text = card.textContent.toLowerCase();
    const matchFilter = _activeFilter === 'all' || specs.includes(_activeFilter.toLowerCase());
    const matchSearch = !_searchQ || text.includes(_searchQ);
    card.style.display = (matchFilter && matchSearch) ? '' : 'none';
  });
}

const searchInput = document.getElementById('search-nutritionists');
const clearSearch = document.getElementById('clear-search');
if (searchInput) {
  searchInput.addEventListener('input', () => {
    _searchQ = searchInput.value.trim().toLowerCase();
    clearSearch.style.display = _searchQ ? 'block' : 'none';
    applyFilters();
  });
  clearSearch.addEventListener('click', () => {
    searchInput.value = ''; _searchQ = '';
    clearSearch.style.display = 'none';
    applyFilters(); searchInput.focus();
  });
}

function openBooking(name) {
  selectedNutritionist = name;
  document.getElementById('booking-modal-title').textContent = 'Book with ' + name;
  document.getElementById('booking-form-body').style.display = 'flex';
  document.getElementById('booking-confirmation').classList.remove('show');
  document.getElementById('booking-modal').classList.add('show');
  document.body.classList.add('modal-open');
}

function closeBooking() {
  document.getElementById('booking-modal').classList.remove('show');
  document.body.classList.remove('modal-open');
}

document.getElementById('booking-modal').addEventListener('click', function(e) {
  if (e.target === this) closeBooking();
});

function submitBooking() {
  const name = document.getElementById('b-name').value.trim();
  const phone = document.getElementById('b-phone').value.trim();
  const goal = document.getElementById('b-goal').value;
  const time = document.getElementById('b-time').value;
  if (!name || !phone || !goal || !time) { alert('Please fill in all required fields.'); return; }
  if (!/^[0-9]{10}$/.test(phone)) { alert('Please enter a valid 10-digit phone number.'); return; }
  const btn = document.querySelector('.booking-submit-btn');
  btn.disabled = true; btn.textContent = 'Booking…';
  const dt = new Date(time).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
  const msg = `Hi! I'd like to book a consultation.\n\nNutritionist: ${selectedNutritionist}\nName: ${name}\nPhone: ${phone}\nGoal: ${goal}\nPreferred Time: ${dt}`;
  setTimeout(() => {
    document.getElementById('booking-form-body').style.display = 'none';
    document.getElementById('booking-confirm-msg').textContent = `Your appointment with ${selectedNutritionist} has been requested for ${dt}. We'll confirm via WhatsApp shortly.`;
    document.getElementById('booking-confirmation').classList.add('show');
    window.open('https://wa.me/919326492088?text=' + encodeURIComponent(msg), '_blank');
    btn.disabled = false; btn.textContent = 'Confirm Booking';
  }, 600);
}
</script>
<script src="/drawer-auth.js"></script>

</body>
</html>
