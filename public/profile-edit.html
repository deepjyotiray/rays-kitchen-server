<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Profile | Ray's Home Kitchen</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent: #da291c; --accent-strong: #bf1c11; }

    body {
      font-family: 'Nunito', -apple-system, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero {
      background: var(--accent);
      color: #fff;
      text-align: center;
      padding: 40px 24px 72px;
    }
    .hero h1 { font-size: 1.4rem; font-weight: 800; }
    .hero p { margin-top: 6px; font-size: 0.875rem; opacity: 0.85; }

    .card {
      background: #fff;
      border-radius: 24px 24px 0 0;
      margin-top: -28px;
      flex: 1;
      padding: 32px 24px 56px;
      max-width: 480px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.08);
    }

    h2 { font-size: 1.2rem; font-weight: 800; color: #111; margin-bottom: 4px; }
    .sub { font-size: 0.875rem; color: #666; margin-bottom: 28px; }

    .label { font-size: 0.75rem; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

    input[type="text"] {
      width: 100%; padding: 14px;
      border: 1.5px solid #e0e0e0; border-radius: 10px;
      font-size: 1rem; font-family: inherit; color: #111;
      background: #fafafa; outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }
    input[type="text"]:focus { border-color: var(--accent); background: #fff; }

    .divider { height: 1px; background: #f0f0f0; margin: 4px 0 20px; }

    /* Pills */
    .pills { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
    .pill {
      padding: 9px 18px;
      border: 1.5px solid #e0e0e0;
      border-radius: 999px;
      font-size: 0.875rem;
      font-family: inherit;
      cursor: pointer;
      background: #fff;
      color: #444;
      transition: all 0.15s;
      user-select: none;
    }
    .pill.on { border-color: var(--accent); background: #fff0ee; color: var(--accent); font-weight: 700; }

    .btn {
      width: 100%; padding: 15px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 800;
      font-family: inherit; cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      margin-top: 8px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:not(:disabled):hover { background: var(--accent-strong); }

    .msg { font-size: 0.85rem; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; display: none; }
    .msg.error { background: #fff0ee; color: #c0392b; display: block; }
  </style>
</head>
<body>

<div class="hero">
  <h1>🍱 Ray's Home Kitchen</h1>
  <p>Just a few details to personalise your experience</p>
</div>

<div class="card">
  <h2>Complete your profile</h2>
  <p class="sub">Tell us a bit about yourself</p>

  <div id="msg" class="msg"></div>

  <div class="label">Your name *</div>
  <input type="text" id="inp-name" placeholder="Full name" autocomplete="name">

  <div class="label">Delivery address *</div>
  <input type="text" id="inp-address" placeholder="House/flat, street, area" autocomplete="street-address">

  <div class="divider"></div>

  <div class="label">Dietary preference</div>
  <div class="pills" id="diet">
    <span class="pill" data-v="veg">🥦 Veg</span>
    <span class="pill" data-v="non-veg">🍗 Non-Veg</span>
    <span class="pill" data-v="eggetarian">🥚 Eggetarian</span>
  </div>

  <div class="label">Health goal</div>
  <div class="pills" id="goal">
    <span class="pill" data-v="weight-loss">⚖️ Weight Loss</span>
    <span class="pill" data-v="muscle-gain">💪 Muscle Gain</span>
    <span class="pill" data-v="balanced">🥗 Balanced</span>
    <span class="pill" data-v="medical">🏥 Medical Diet</span>
  </div>

  <button class="btn" id="btn-save" onclick="save()">Save &amp; Continue →</button>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const mobile = params.get('mobile') || '';
  const redirect = params.get('redirect') || '/';

  // Guard: must have mobile (came from login flow)
  if (!mobile) window.location.href = '/login';

  // Single-select pills
  document.querySelectorAll('.pills').forEach(group => {
    group.addEventListener('click', e => {
      const pill = e.target.closest('.pill');
      if (!pill) return;
      group.querySelectorAll('.pill').forEach(p => p.classList.remove('on'));
      pill.classList.add('on');
    });
  });

  async function save() {
    const name = document.getElementById('inp-name').value.trim();
    const address = document.getElementById('inp-address').value.trim();
    if (!name) { showMsg('Please enter your name', 'error'); return; }
    if (!address) { showMsg('Please enter your delivery address', 'error'); return; }

    const diet = document.querySelector('#diet .pill.on')?.dataset.v || '';
    const goal = document.querySelector('#goal .pill.on')?.dataset.v || '';

    const btn = document.getElementById('btn-save');
    btn.disabled = true; btn.textContent = 'Saving…';

    try {
      const res = await fetch('/users/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, mobile: '+91' + mobile, address, diet, goal })
      });
      if (!res.ok) throw new Error('Registration failed');
      const sep = redirect.includes('?') ? '&' : '?';
      window.location.href = redirect + sep + 'loggedin=1';
    } catch {
      showMsg('Could not save profile. Please try again.', 'error');
      btn.disabled = false; btn.textContent = 'Save & Continue →';
    }
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  document.getElementById('inp-name').focus();
</script>
</body>
</html>
