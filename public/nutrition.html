<script>
const CAT_LABELS = {
  'weight-loss': 'Weight Loss',
  'muscle-gain': 'Muscle Gain',
  'medical': 'Medical Nutrition',
  'recipes': 'Healthy Recipes',
  'myths': 'Nutrition Myths'
};

let _allArticles = [];
let _activeCat = null;

function renderArticles(articles) {
  const container = document.getElementById('article-cards');
  container.innerHTML = articles.length
    ? articles.map(a => `<div class="article-card"><img src="${a.image}" alt="${a.title}" loading="lazy"><div class="article-card-body"><div class="article-card-cat">${CAT_LABELS[a.category]||a.category}</div><div class="article-card-title">${a.title}</div><div class="article-card-meta">${a.author} &bull; ${a.readingTime} min read</div>${a.excerpt?`<div style="font-size:13px;color:var(--muted);margin-top:6px">${a.excerpt}</div>`:''}</div></div>`).join('')
    : '<div style="color:var(--muted);padding:20px">No articles yet. Check back soon!</div>';
}

function openNutritionSearch() {
  const btn = document.getElementById('nutrition-search-btn');
  const pill = document.getElementById('nutrition-search-pill');
  const wrapper = document.getElementById('nutrition-search-wrapper');
  btn.style.display = 'none';
  pill.classList.add('open');
  wrapper.classList.add('open');
  document.getElementById('search-articles').focus();
}
function clearNutritionSearch() {
  const btn = document.getElementById('nutrition-search-btn');
  const pill = document.getElementById('nutrition-search-pill');
  const wrapper = document.getElementById('nutrition-search-wrapper');
  document.getElementById('search-articles').value = '';
  btn.style.display = '';
  pill.classList.remove('open');
  wrapper.classList.remove('open');
  renderArticles(_activeCat ? _allArticles.filter(a => a.category === _activeCat) : _allArticles);
}
function onNutritionSearchInput(q) {
  const lq = q.trim().toLowerCase();
  const base = _activeCat ? _allArticles.filter(a => a.category === _activeCat) : _allArticles;
  renderArticles(lq ? base.filter(a => a.title.toLowerCase().includes(lq) || (a.excerpt||'').toLowerCase().includes(lq)) : base);
}

function filterCat(cat) {
  const isToggleOff = _activeCat === cat;
  _activeCat = isToggleOff ? null : cat;
  // Update pill active states
  document.querySelectorAll('#nutrition-cat-grid .category-card').forEach(btn => {
    const on = btn.dataset.cat === _activeCat;
    btn.classList.toggle('category-card--active', on);
  });
  const title = document.getElementById('articles-section-title');
  const backBtn = document.getElementById('nutrition-back-btn');
  const si = document.getElementById('search-articles');
  if (_activeCat) {
    if (title) title.textContent = CAT_LABELS[_activeCat] || _activeCat;
    if (backBtn) backBtn.style.display = 'inline-block';
    if (si) si.value = '';
  } else {
    if (title) title.textContent = 'Latest Articles';
    if (backBtn) backBtn.style.display = 'none';
  }
  renderArticles(_activeCat ? _allArticles.filter(a => a.category === _activeCat) : _allArticles);
  if (_activeCat) {
    document.querySelector('.articles-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

fetch('/blogs.json')
  .then(r => r.json())
  .then(data => {
    _allArticles = data.articles || [];
    renderArticles(_allArticles);
  })
  .catch(() => {
    document.getElementById('article-cards').innerHTML = '<div style="color:var(--muted);padding:20px">Could not load articles.</div>';
  });
</script>
<script src="/drawer-auth.js"></script>

</body>
