<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Tracking | Healthy Meal Spot</title>
<meta name="robots" content="noindex, nofollow">
<script>
  const id = new URLSearchParams(location.search).get('orderId') || '';
  location.replace('/' + (id ? '?orderId=' + encodeURIComponent(id) : '') + '#order');
</script>
</head><body></body></html>
