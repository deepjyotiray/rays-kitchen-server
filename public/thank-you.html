<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Order Placed | Healthy Meal Spot</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/style.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TE81BJG5TS"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-TE81BJG5TS');</script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    .ty-body {
      position: fixed;
      top: 56px; /* app-bar height */
      bottom: 56px; /* bottom nav height */
      left: 0; right: 0;
      overflow-y: auto;
      padding: 16px 12px;
      max-width: 560px;
      margin: 0 auto;
    }
    .ty-hero {
      background: #ecfdf3;
      border-radius: 16px;
      padding: 16px 20px 14px;
      text-align: center;
      margin-bottom: 10px;
      border: 1px solid #d1fae5;
    }
    .ty-hero .icon { font-size: 36px; line-height: 1; margin-bottom: 6px; }
    .ty-hero h1 { margin: 0 0 4px; font-size: 20px; color: #166534; font-weight: 800; }
    .ty-hero p { margin: 0; color: #4b5563; font-size: 13px; }
    .wa-notice {
      display: flex; align-items: flex-start; gap: 10px;
      background: rgba(37,211,102,0.08);
      border: 1px solid rgba(37,211,102,0.25);
      border-radius: 12px; padding: 10px 12px;
      margin-bottom: 10px; font-size: 13px; line-height: 1.4;
    }
    .wa-notice .wa-icon { font-size: 18px; flex-shrink: 0; }
    .meta-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 6px; margin-bottom: 10px;
    }
    .meta-item {
      background: #f9fafb; border: 1px solid #e5e7eb;
      border-radius: 10px; padding: 8px 10px;
    }
    .meta-item.full { grid-column: 1 / -1; }
    .meta-label { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 1px; }
    .meta-value { font-size: 13px; font-weight: 600; word-break: break-word; }
    .ty-section { margin-bottom: 10px; }
    .ty-section-title { font-size: 11px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    pre {
      background: #f9fafb; padding: 10px; border-radius: 10px;
      font-size: 12px; white-space: pre-wrap;
      border: 1px solid #e5e7eb; margin: 0; font-family: inherit;
      max-height: 90px; overflow-y: auto;
    }
    .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    .btn {
      flex: 1; border: 0; border-radius: 12px;
      padding: 13px 12px; font-weight: 700;
      cursor: pointer; font-size: 15px; font-family: inherit;
    }
    .btn.primary { background: var(--accent, #da291c); color: #fff; }
    .help { text-align: center; color: #6b7280; font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>

<!-- Top App Bar (matches index.html) -->
<header class="app-bar">
  <a href="/" class="app-bar-brand" style="margin-left:-4px">
    <img src="/favicon.png" alt="" class="app-bar-logo" width="36" height="36">
  </a>
  <div class="app-bar-actions" style="margin-left:auto">
    <span style="font-size:15px;font-weight:700;color:var(--accent)">Order Placed 🎉</span>
  </div>
</header>

<div class="ty-body">
  <div class="ty-hero">
    <div class="icon">🎉</div>
    <h1>Order Placed!</h1>
    <p>We've received your order and will get back to you shortly.</p>
  </div>

  <div class="wa-notice">
    <span class="wa-icon">💬</span>
    <span>We'll contact you on <strong>WhatsApp</strong> to confirm your order and keep you updated on delivery status.</span>
  </div>

  <div id="order-meta" class="meta-grid"></div>

  <div class="ty-section">
    <div class="ty-section-title">Items Ordered</div>
    <pre id="order-items">Loading…</pre>
  </div>

  <div class="ty-section" id="extras-section" style="display:none">
    <div class="ty-section-title">Charges &amp; Discounts</div>
    <pre id="order-extras"></pre>
  </div>

  <div class="btn-row">
    <button class="btn primary" onclick="window.location.href='/?tab=menu'">Back to Menu</button>
  </div>

  <div class="help">Need help? Call / WhatsApp: <strong>+91 88505 45924</strong></div>
</div>

<!-- Mobile bottom nav (matches index.html) -->
<nav id="mobile-bottom-nav">
  <button class="mob-nav-btn" onclick="window.location.href='/'">
    <i class="fa-solid fa-house"></i>Home
  </button>
  <button class="mob-nav-btn active" onclick="window.location.href='/?tab=menu'">
    <i class="fa-solid fa-utensils"></i>Menu
  </button>
  <button class="mob-nav-btn" onclick="window.location.href='/nutrition'">
    <i class="fa-solid fa-leaf"></i>Nutrition
  </button>
  <button class="mob-nav-btn" onclick="window.location.href='/consult-nutritionist'">
    <i class="fa-solid fa-stethoscope"></i>Consult
  </button>
  <button class="mob-nav-btn" onclick="window.location.href='/?tab=myhealth'">
    <i class="fa-solid fa-heart-pulse"></i>My Health
  </button>
</nav>

<script>
  (function () {
    let data = null;
    try { data = JSON.parse(sessionStorage.getItem('LAST_ORDER') || 'null'); } catch (_) {}

    if (!data) {
      document.getElementById('order-items').textContent = 'Order details unavailable.';
      return;
    }

    const meta = document.getElementById('order-meta');
    const rows = [
      ['Order ID', data.orderId],
      ['For', (data.orderFor || '') + (data.orderForDateISO ? ' (' + data.orderForDateISO + ')' : '')],
      ['Name', data.name],
      ['Phone', data.phone],
      ['Address', data.address, true],
    ];
    rows.filter(r => r[1]).forEach(([label, value, full]) => {
      const cell = document.createElement('div');
      cell.className = 'meta-item' + (full ? ' full' : '');
      const lbl = document.createElement('div');
      lbl.className = 'meta-label';
      lbl.textContent = label;
      const val = document.createElement('div');
      val.className = 'meta-value';
      val.textContent = value;
      cell.append(lbl, val);
      meta.appendChild(cell);
    });

    document.getElementById('order-items').textContent = data.items || 'No items captured.';

    if (data.extras) {
      document.getElementById('order-extras').textContent = data.extras;
      document.getElementById('extras-section').style.display = 'block';
    }
  })();
</script>
</body>
</html>
